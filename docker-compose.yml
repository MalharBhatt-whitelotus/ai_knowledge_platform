version: "3.9"

services:

  postgres:
    image: postgres:17
    container_name: ai_postgre
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgre_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ai_redis
    restart: always
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4-management
    container_name: ai_rabbitmq
    restart: always
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASSWORD: ${RABBIT_DEFAULT_PAS}
    ports:
      - "5672:5672"
      - "15672:15672"
  
  gateway_service:
    build:
      context: .
      dockerfile: services/gateway_service/Dockerfile
    
    container_name: gateway_service

    ports:
      - "8000:8000"

    env_file:
      - .env
    
    depends_on:
      - postgres
      - redis
      - rabbitmq
    
    volumes:
     - .:/app
volumes:
  postgre_data: