version: "3.9"

services:

  postgres:
    image: postgres:17
    container_name: ai_knowledge_platform_server
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgre_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ai_redis
    restart: always
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4-management
    container_name: ai_rabbitmq
    restart: always
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASSWORD: ${RABBITMQ_DEFAULT_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
  
  gateway_service:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    
    container_name: gateway_service

    ports:
      - "8000:8000"

    env_file:
      - .env
    
    depends_on:
      - postgres
      - redis
      - rabbitmq
    
    volumes:
     - .:/app
  
  ai_service:
    build:
      context: . 
      dockerfile: services/ai/Dockerfile
    
    container_name: ai_service

    ports:
      - "8005:8005"
    
    env_file:
      - .env
    
    depends_on:
      - postgres
      - redis
      - rabbitmq
    
    volumes:
      - .:/app
  auth_service:
    build:
      context: . 
      dockerfile: services/auth/Dockerfile
    
    container_name: auth_service

    ports:
      - "8001:8001"
    
    env_file:
      - services/auth/.env
    
    depends_on:
      - postgres
      - redis
      - rabbitmq
    
    volumes:
      - .:/app
  
  embedding_service:
    build:
      context: . 
      dockerfile: services/embedding/Dockerfile
    
    container_name: embedding_service

    ports:
      - "8003:8003"
    
    env_file:
      - .env
    
    depends_on:
      - postgres
      - redis
      - rabbitmq
    
    volumes:
      - .:/app
  file_service:
    build:
      context: . 
      dockerfile: services/file/Dockerfile
    
    container_name: file_service

    ports:
      - "8002:8002"
    
    env_file:
      - .env
    
    depends_on:
      - postgres
      - redis
      - rabbitmq
    
    volumes:
      - .:/app
  search_service:
    build:
      context: . 
      dockerfile: services/search/Dockerfile
    
    container_name: search_service

    ports:
      - "8004:8004"
    
    env_file:
      - .env
    
    depends_on:
      - postgres
      - redis
      - rabbitmq
    
    volumes:
      - .:/app
  worker_service:
    build:
      context: . 
      dockerfile: services/worker/Dockerfile
    
    container_name: worker_service

    ports:
      - "8006:8006"
    
    env_file:
      - .env
    
    depends_on:
      - postgres
      - redis
      - rabbitmq
    
    volumes:
      - .:/app
  
volumes:
  postgre_data: