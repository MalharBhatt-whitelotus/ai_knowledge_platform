[project]
name = "ai-knowledge-platform"
version = "0.1.0"
description = "AI Knowledge Search Platform"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "sqlalchemy",
    "asyncpg",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "python-multipart",
    "redis",
    "celery",
    "aio-pika",
    "pymupdf",
    "chromadb",
    "openai",
    "tenacity",
    "structlog",
    "pytest",
    "pytest-asyncio",
    "alembic",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3",
    "jose>=1.0.0",
    "jwt>=1.4.0",
    "python-jose>=3.5.0",
    "passlib>=1.7.4",
    "bcrypt==4.0.0",
]
