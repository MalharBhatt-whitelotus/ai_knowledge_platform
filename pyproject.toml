[project]
name = "ai-knowledge-platform"
version = "0.1.0"
description = "AI Knowledge Search Platform"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "sqlalchemy",
    "asyncpg",
    "pydantic[email]",
    "pydantic-settings",
    "python-dotenv",
    "python-multipart",
    "redis",
    "celery",
    "aio-pika",
    "pymupdf",
    "chromadb>=1.0.0",
    "openai",
    "tenacity",
    "structlog",
    "pytest",
    "pytest-asyncio",
    "alembic",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3",
    "jwt>=1.4.0",
    "python-jose>=3.5.0",
    "passlib>=1.7.4",
    "bcrypt>=4.0.1",
    "greenlet>=3.5.4",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "langchain>=1.3.14",
    "langchain-text-splitters>=1.1.2",
    "sentence-transformers>=5.6.1",
    "pwdlib[argon2]>=0.3.0",
    "google-genai>=2.17.0",
]
