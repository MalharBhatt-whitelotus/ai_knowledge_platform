[project]
name = "ai-knowledge-platform"
version = "0.1.0"
description = "AI Knowledge Search Platform"
requires-python = ">=3.12"

dependencies = [
    # Web / API
    "fastapi",
    "uvicorn[standard]",
    "httpx",

    # Database
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "psycopg[binary]>=3.3",
    "greenlet>=3.5.4",

    # Configuration / validation
    "pydantic[email]",
    "pydantic-settings",
    "python-dotenv",

    # Authentication
    "jwt>=1.4.0",
    "python-jose>=3.5.0",
    "passlib>=1.7.4",
    "bcrypt>=4.0.1",
    "pwdlib[argon2]>=0.3.0",

    # Messaging / background jobs
    "redis",
    "celery",
    "aio-pika",

    # File handling
    "python-multipart",
    "pymupdf",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",

    # AI API
    "openai",
    "google-genai>=2.17.0",
    "tenacity",

    # Prompt / chunking
    "langchain>=1.3.14",
    "langchain-text-splitters>=1.1.2",

    # Observability
    "structlog",
    "prometheus-client>=0.26.0",

    # Templates
    "jinja2>=3.1.6",
]


[project.optional-dependencies]

embedding = [
    "sentence-transformers>=5.6.1",
]

search = [
    "chromadb>=1.0.0",
]

dev = [
    "pytest",
    "pytest-asyncio",
    "locust>=2.46.3",
]

[tool.setuptools.packages.find]
include = ["shared_lib*"]